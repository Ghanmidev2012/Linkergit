<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkergit</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg w-100 bg-body-tertiary" >
        <div class="container-fluid w-100">
            <h1 style="text-align: center;">LinkerGit</h1>
        </div>
    </nav>
    <div class="container my-3">
        <div class="search-panel">
            <label for="inp" class="search-label">Enter a GitHub username:</label>
            <div class="search-controls">
                <input type="text" class="form-control search-input" id="inp" placeholder="Ghanmideb2012" aria-label="GitHub username">
                <button id="search" class="btn btn-outline-primary search-button">Search</button>
            </div>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
    </div>
    
   

    <script src="https://kit.fontawesome.com/c721f17269.js" crossorigin="anonymous"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
